cucumberJava8 = "7.20.1"
kotlin = "2.3.20-RC2"
kotlinter = "5.4.2"
vanniktechPublish = "0.36.0"
java = "21"

[libraries]
cucumber-java8 = { module = "io.cucumber:cucumber-java8", version.ref = "cucumberJava8" }

[plugins]
android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradle" }
